name: Medico.com
description: Medico.com was a Spanish-language online health portal and question-and-answer community,
  offering health reference articles, health news, and topic-focused Q&A around conditions such as
  diabetes, heart disease, and depression, initially targeting Hispanic markets. Backed by 500 Global,
  FJ Labs, First Round Capital, and FirstMark Capital, it was acquired by Everyday Health. The medico.com
  domain now 301-redirects to everydayhealth.com and exposes no independent developer portal, API, or
  documentation. Surfaced in the API Evangelist network as a 500 Global portfolio lead; enrichment found
  no live API surface.
